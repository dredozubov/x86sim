[package]
name = "x86sim-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "x86Sim launcher core: chunked AOT image (static discovery, incremental build), feature toggles, sim control"

[lib]
name = "x86sim_core"
path = "src/lib.rs"

[[bin]]
name = "x86sim-aot"
path = "src/bin/aot.rs"

[[bin]]
name = "x86sim-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "x86sim-ax"
path = "src/bin/ax.rs"

[[bin]]
name = "x86sim-dev"
path = "src/bin/dev.rs"

[[bin]]
name = "x86sim-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "x86sim-pool"
path = "src/bin/pool.rs"

[[bin]]
name = "x86sim-account"
path = "src/bin/account.rs"

[[bin]]
name = "x86sim-devapp"
path = "src/bin/devapp.rs"

[dependencies]
simfb-ring = { path = "../shared/simfb-ring" }
simhid = { path = "../shared/simhid" }
simaudio = { path = "../shared/simaudio" }
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
png = "0.18"
# Share: the browser stream (x86sim serve): H.264 built from source (no ffmpeg in the AppImage), JPEG fallback,
# QR codes for the share URL, SHA-1 for the WebSocket handshake
openh264 = "0.9"
jpeg-encoder = "0.7"
qrcode = { version = "0.14", default-features = false }
sha1_smol = "1"
# Share audio: Opus (libopus built from source by audiopus_sys and linked statically; tools/launcher/.cargo/config.toml
# keeps it off the host's pkg-config and lets its CMake build under CMake 4)
opus = "0.3"
audiopus_sys = { version = "0.2", features = ["static"] }
# OCR of frames (snapshot ocr, text in Metal / game / canvas views): pure Rust, models downloaded once (ocr.rs)
ocrs = { version = "0.14", default-features = false, features = ["onnx"] }
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-imageproc = "0.28"
sha2 = "0.10"
# Apple Account sign-in (account.rs): SRP-6a with PBKDF2-SHA256 as Apple's sign-in wants, base64 for its JSON, and the
# .xip's zlib table of contents (HTTP stays curl)
num-bigint = "0.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
flate2 = "1"
# Xcode's 3D device models (devicemodel.rs): Apple's .usdz read from the user's own Xcode.xip (never shipped); a pure Rust
# USD reader, the package's zip, and JPEG textures decoded for the launcher
openusd = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
zune-jpeg = "0.5"
zune-core = "0.5"
